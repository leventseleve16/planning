:root{--bg:#f4f4f1;--surface:#ffffff;--ink:#1b1d1f;--muted:#7c7f80;--line:#dcdcd6;--line2:#ecece7;--accent:#2d5875;--accent-ink:#ffffff;--soft:#eef2f5;--lunch:#e7e6e0;--done:#c9c9c4;--done-ink:#6d6d68;--bad:#b3261e;--ok:#2f6b3a;--okbg:#e2efe2;--kobg:#f8e9d0;--ko:#8a5a0b;--wait:#ffffff;

      <div className="tabs" role="tablist">

          <label className="under"><input id="f-enl" type="checkbox" checked={!!f.enlevement} onChange={e=>s('enlevement',e.target.checked)}/> Enlèvement sur site</label></Fld>
      </div>

        <span>{f.fichiersOk?'L\'OF peut démarrer.':'Sans cette case, l\'OF est hachuré et ne peut pas démarrer.'} {isBat?<>BAT à envoyer au plus tard le <b>{fmtD(lim)}</b> ({params.delaiBATJO} j ouvrés après la commande).</>:!lim?<>Les {f.delai||params.delaiJ} jours de délai client partiront du jour où tu coches « BAT validé ».</>:<>{f.enlevement?'Fin de fabrication':'Expédition'} au plus tard le <b>{fmtD(lim)}</b>{f.enlevement?'':' (livraison '+fmtD(liv)+' moins '+(f.transportJO??params.transportJO)+' j ouvrés de transport)'}{f.exemplaire&&f.batValideLe?', délai compté depuis la validation du BAT le '+fmtD(new Date(f.batValideLe+'T12:00')):''}.</>}</span></div>
      </section>
    </>}
    {tab==='ops'&&<section className="fsec opsec">
      {man&&<div className="row modrow"><span className="lbl">Partir d'un modèle :</span>{modeles.map(m=><button type="button" key={m.id} className="btn sm" onClick={()=>s('opsManuelles',m.ops.map(x=>({...x,id:'M'+uid()})))}>{m.nom}</button>)}</div>}
      <div className="tblwrap"><table className="optbl compact"><thead><tr><th>Opération</th><th>Données techniques</th><th className="n">Durée prévue</th><th className="c">Fait</th><th/></tr></thead><tbody>
        {ops.map((o,i)=>{const e=(f.etat||{})[o.code]||{};const editable=man||isExtra(o.code);const forced=!editable&&f.surcharges[o.code]!=null&&f.surcharges[o.code]!=='';
          const grpRow=!man&&o.grp&&(i===0||ops[i-1].grp!==o.grp);const src=man?f.opsManuelles.find(m=>m.id===o.code):f.extraOps.find(m=>m.id===o.code);
          return <React.Fragment key={o.code}>{grpRow&&<tr className={'grprow g-'+o.grp}><td colSpan={5}>{grpName[o.grp]||o.grp}</td></tr>}<tr id={'av-'+o.code} className={(of._focusOp===o.code?'focusop':'')+(e.done?' isdone':'')+(isExtra(o.code)?' extra':'')}>
          <td>{editable&&src?<div className="manop"><Picto m={src.machine} size={20} className="mpicl"/><input id={'m-l'+o.code} className="inp" value={src.label} onChange={ev=>editOp(o.code,'label',ev.target.value)} aria-label="Intitulé"/>
                <select id={'m-m'+o.code} className="inp" value={src.machine} onChange={ev=>editOp(o.code,'machine',ev.target.value)} aria-label="Machine">{MACHINES.map(x=><option key={x.id} value={x.id}>{x.nom}</option>)}</select></div>
              :<><span className="opname"><Picto m={o.machine} size={18}/>{o.label}</span><span className="opmach">{MACHINES.find(m=>m.id===o.machine).nom}{o.waitH?' · puis séchage '+o.waitH+' h':''}</span></>}</td>
          <td className="notecell"><NoteInput id={'n-'+o.code} value={e.note||''} onCommit={v=>setEt(o.code,cur=>{if(v)cur.note=v;else delete cur.note;return cur;})}/></td>
          <td className="n"><div className="durcell"><DurInput id={'d-'+o.code} min={o.op} onCommit={m=>editable?editOp(o.code,'op',m):s('surcharges',{...f.surcharges,[o.code]:m})}/>
            {forced&&<button type="button" className="ib" title="Revenir au temps calculé" onClick={()=>{const sc={...f.surcharges};delete sc[o.code];s('surcharges',sc);}}>↺ calculé</button>}</div></td>
          <td className="c"><input id={'done-'+o.code} type="checkbox" className="big" checked={!!e.done} onChange={ev=>setDone(o.code,ev.target.checked)} aria-label={'Fait : '+o.label}/></td>
          <td className="opact">{editable&&<><button type="button" className="ib" aria-label="Monter" title="Monter" onClick={()=>moveOp(o.code,-1)}>▲</button><button type="button" className="ib" aria-label="Descendre" title="Descendre" onClick={()=>moveOp(o.code,1)}>▼</button><button type="button" className="ib" aria-label="Retirer" title="Retirer" onClick={()=>delOp(o.code)}>✕</button></>}
            {e.nbD&&!e.done&&<button type="button" className="btn sm" onClick={()=>setEt(o.code,cur=>{delete cur.nbD;return cur;})}>Replacer au plus tôt</button>}</td></tr></React.Fragment>;})}
      </tbody></table></div>
      {ops.some(o=>((f.etat||{})[o.code]||{}).nbD)&&<div className="row pinrow"><span>📌 Certaines opérations ont été glissées plus tard sur le planning (position « pas avant »).</span><button type="button" className="btn sm" onClick={()=>setF(x=>{const et={};Object.entries(x.etat||{}).forEach(([k,v])=>{const c={...v};delete c.nbD;et[k]=c;});return{...x,etat:et};})}>Tout replacer au plus tôt</button></div>}
      <div className="row addop"><button type="button" className="btn sm btn-dark" onClick={addOp}>+ Ajouter une opération</button>
        {!man&&<><span className="lbl">après</span><select id="f-ins" className="inp" value={insAfter||ops[ops.length-1]?.code||''} onChange={e=>setInsAfter(e.target.value)}>{ops.map(o=><option key={o.code} value={o.code}>{o.label}</option>)}</select></>}
        <span className="note">{man?'Les opérations s\'enchaînent dans l\'ordre du tableau (▲▼ pour déplacer).':'Une opération ajoutée s\'insère dans l\'enchaînement ; ▲▼ la déplace entre deux opérations.'} Un pelliculage ajoute 12 h de séchage.</span></div>
    </section>}
    </div>
    <div className="mfoot"><button type="button" className="btn" onClick={onClose}>Annuler</button><button className="btn btn-primary" type="submit">Enregistrer l'OF</button></div>
  </form></div>;
}
/* Fiche A4 des tâches du jour (PDF). Dans claude.ai : enregistrement via la capacité downloads ; ailleurs : téléchargement direct. */
async function pdfJour(list,ofById,cal,titre,fic,heure){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  doc.setFont('helvetica','bold');doc.setFontSize(titre.length>50?12:15);doc.text('Tâches : '+titre,12,15);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);doc.text('Le Vent Se Lève · atelier impression · '+list.length+' tâches, dans l\'ordre de passage prévu',12,21);doc.setTextColor(0);
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const body=list.map(t=>{const of=ofById[t.ofId];const pap=t.code==='IMP_INT'?'\n'+(of.couleur==='NB'?'N/B':'Couleur')+' · '+of.papierInt+(of.papierInt2?' + '+of.papierInt2+' (p. '+(of.pagesInt2||'?')+')':''):t.code==='IMP_COUV'?'\n'+of.papierCouv:'';
    return {done:!!t.done,bg:OF_COLORS[of.couleurIdx||0][0],row:['',heure(t),t.label+'\n'+MACHINES.find(m=>m.id===t.machine).nom,(of.batDe?'BAT · ':'')+of.titre+'\nOF '+of.numero+' · Qté '+of.quantite+pap,((of.etat||{})[t.code]||{}).note||'',hhmm(t.op)+(t.machine==='presse'?'\n+ machine '+hhmm(t.mach):'')]};});
  doc.autoTable({startY:26,margin:{left:10,right:10},head:[['Fait','Heure','Opération','Titre','Données techniques','Durée']],body:body.map(b=>b.row),
    styles:{font:'helvetica',fontSize:8.5,cellPadding:2,valign:'middle',lineColor:[200,200,200],lineWidth:0.2,overflow:'linebreak'},
    headStyles:{fillColor:[31,42,68],textColor:255,fontStyle:'bold'},
    columnStyles:{0:{cellWidth:11},1:{cellWidth:14,fontStyle:'bold'},2:{cellWidth:34,fontStyle:'bold'},3:{cellWidth:58},4:{cellWidth:51},5:{cellWidth:22,halign:'right'}},
    didParseCell:d=>{if(d.section==='body'){const b=body[d.row.index];d.cell.styles.fillColor=b.done?[225,225,225]:hex(b.bg);if(d.column.index===4)d.cell.styles.minCellHeight=12;}},
    didDrawCell:d=>{if(d.section==='body'&&d.column.index===0){const x=d.cell.x+3,y=d.cell.y+d.cell.height/2-2.5;doc.setDrawColor(40);doc.setLineWidth(0.4);doc.setFillColor(255,255,255);doc.rect(x,y,5,5,'FD');if(body[d.row.index].done){doc.setLineWidth(0.6);doc.line(x+1,y+2.6,x+2.2,y+3.9);doc.line(x+2.2,y+3.9,x+4.2,y+1.1);}}},
    didDrawPage:()=>{doc.setFontSize(8);doc.setTextColor(120);doc.text('Imprimé le '+new Date().toLocaleString('fr-FR'),10,290);doc.text('Page '+doc.getNumberOfPages(),200,290,{align:'right'});doc.setTextColor(0);}});
  const name='taches-'+fic+'.pdf';
  const dl=window.claude?.use?await window.claude.use('downloads'):null;
  if(!dl){doc.save(name);return '';}
  try{await dl.save({filename:name,data:doc.output('blob')});return '';}catch(e){return e&&e.code==='declined'?'':'Le PDF n\'a pas pu être enregistré ici. Ouvre le planning dans le navigateur pour l\'imprimer.';}
}
function Daily({sched,ofs,cal,now,onToggle,onOpen,onClose,onDur,onNote}){
  const[msg,setMsg]=useState('');
  const nowW=cal.date2w(now);const di=Math.floor(nowW/WD);
  /* Plage affichée : aujourd'hui par défaut ; raccourcis ou début / fin (date + heure) au choix */
  const loc=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const at=(k,h)=>{const d=cal.dayDate(di+k);d.setHours(h,0,0,0);return loc(d);};
  const finSem=4-((di%5)+5)%5;
  const PRESETS=[['Aujourd\'hui',0,0],['Demain',1,1],['Aujourd\'hui + demain',0,1],['Cette semaine',0,finSem],['Semaine prochaine',finSem+1,finSem+5]];
  const[rg,setRg]=useState(()=>({a:at(0,9),b:at(0,20)}));
  const wa=cal.date2w(new Date(rg.a)),wb=cal.date2w(new Date(rg.b));
  const ofById=Object.fromEntries(ofs.map(o=>[o.id,o]));
  const list=sched.tasks.filter(t=>t.s>=wa&&t.s<wb&&ofById[t.ofId]&&ofById[t.ofId].fichiersOk).sort((a,b)=>a.s-b.s);
  const nb=list.filter(t=>t.done).length;
  const multi=Math.floor(wa/WD)!==Math.floor(Math.max(wa,wb-1)/WD);
  const fD=x=>new Date(x).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}), fT=x=>x.slice(11,16).replace(':','h');
  const titre=!multi&&rg.a.slice(11)==='09:00'&&rg.b.slice(11)==='20:00'?fD(rg.a):multi?'Du '+fD(rg.a)+' '+fT(rg.a)+' au '+fD(rg.b)+' '+fT(rg.b):fD(rg.a)+', '+fT(rg.a)+' – '+fT(rg.b);
  const heure=t=>cal.w2date(t.s).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const heurePdf=t=>{const d=cal.w2date(t.s);return (multi?d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})+'\n':'')+heure(t);};
  const jourDe=t=>Math.floor(t.s/WD);
  return <div className="overlay"><div className="modal daily" role="dialog" aria-label="Tâches du jour">
    <div className="mhead"><div><span className="eyebrow">Tâches · {nb}/{list.length} faites</span><h3>{titre}</h3></div>
      <div className="row0"><button className="btn btn-dark" onClick={()=>pdfJour(list,ofById,cal,titre,rg.a.slice(0,10)+(multi?'_'+rg.b.slice(0,10):''),heurePdf).then(m=>m&&setMsg(m))} disabled={!list.length}>⎙ Imprimer (PDF A4)</button><button className="ib x" onClick={onClose} aria-label="Fermer">✕</button></div></div>
    <div className="rangebar">
      <div className="chips" role="group" aria-label="Période">{PRESETS.map(([l,k1,k2])=>{const v={a:at(k1,9),b:at(k2,20)};return <button key={l} className={'pchip'+(rg.a===v.a&&rg.b===v.b?' on':'')} onClick={()=>setRg(v)}>{l}</button>;})}</div>
      <label className="rgf">Du <input id="rg-a" className="inp" type="datetime-local" step="900" value={rg.a} onChange={e=>e.target.value&&setRg(r=>({a:e.target.value,b:e.target.value>r.b?e.target.value.slice(0,10)+'T20:00':r.b}))}/></label>
      <label className="rgf">au <input id="rg-b" className="inp" type="datetime-local" step="900" value={rg.b} onChange={e=>e.target.value&&setRg(r=>({...r,b:e.target.value}))}/></label>
    </div>
    {msg&&<p className="warn pdfmsg">{msg}</p>}
    <div className="mbody">
      {list.length===0?<p className="note">Aucune tâche prévue sur cette période.</p>:
      <><div className="dhead"><span>Fait</span><span>Heure</span><span>Opération</span><span>Titre</span><span>Données techniques</span><span>Durée</span><span/></div><ul className="dlist">{list.map((t,i)=>{const of=ofById[t.ofId];const[bg,fg]=OF_COLORS[of.couleurIdx||0];const late=!t.done&&t.s<nowW;
        const sep=multi&&(i===0||jourDe(list[i-1])!==jourDe(t));
        return <React.Fragment key={t.ofId+t.code}>{sep&&<li className="dsep">{cal.dayDate(jourDe(t)).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</li>}<li className={t.done?'done':''} style={{'--bg':bg,'--fg':fg}}>
          <input id={'dl-'+t.ofId+t.code} type="checkbox" className="big" checked={!!t.done} onChange={()=>onToggle(t)} aria-label={'Fait : '+t.label}/>
          <span className="dh">{heure(t)}</span>
          <span className="dop"><Picto m={t.machine} size={18}/>{t.label}</span>
          <span className="dt"><span className="dtit">{of.batDe?'BAT · ':''}{of.titre}</span><span className="dmeta"><span>OF {of.numero}</span><span>Qté {of.quantite}</span>{t.code==='IMP_INT'&&<span>{of.couleur==='NB'?'N/B':'Couleur'} · {of.papierInt}{of.papierInt2?' + '+of.papierInt2+' (p. '+(of.pagesInt2||'?')+')':''}</span>}{t.code==='IMP_COUV'&&<span>{of.papierCouv}</span>}{!of.fichiersOk&&<span className="dwarn">fichiers non validés</span>}</span></span>
          <NoteInput id={'dn-'+t.ofId+t.code} value={((of.etat||{})[t.code]||{}).note||''} onCommit={v=>onNote(t,v)}/>
          <DurInput id={'dd-'+t.ofId+t.code} min={t.op} onCommit={m=>onDur(t,m)}/>
          <button className="btn sm" onClick={()=>onOpen(t)}>OF</button>
        </li></React.Fragment>;})}</ul></>}
      <p className="note">Liste dans l'ordre de passage prévu. Seuls les OF dont les fichiers sont validés apparaissent ici. Cocher une tâche la marque faite sur le planning et dans l'OF ; les tâches suivantes se recalculent aussitôt.</p>
    </div></div></div>;
}
function NoteInput({id,value,onCommit}){const[v,setV]=useState(value);const r=useRef(null);useEffect(()=>setV(value),[value]);
  useEffect(()=>{const el=r.current;if(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}},[v]);

  const mv=(id,i,d)=>upd(id,m=>{const n=[...m.ops];const j=i+d;if(j<0||j>=n.length)return m;[n[i],n[j]]=[n[j],n[i]];return{...m,ops:n};});

          <td><input id={'md-'+m.id+i} className="inp n" type="number" min="1" value={o.op} onChange={e=>updOp(m.id,i,'op',+e.target.value)}/></td>

      </tbody></table>
      <button className="btn sm" onClick={()=>upd(m.id,x=>({...x,ops:[...x.ops,{label:'Opération',machine:'massicot',op:10}]}))}>+ Ajouter une opération</button>
    </section>)}
    <button className="btn btn-dark" onClick={()=>setModeles(l=>[...l,{id:'m'+uid(),nom:'Nouveau modèle',ops:[{label:'Impression',machine:'presse',op:5},{label:'Massicot',machine:'massicot',op:10},{label:'Emballage',machine:'emballeuse',op:10}]}])}>+ Nouveau modèle</button>
  </div>;
}

/* ===== MODE EN LIGNE (Supabase) : actif seulement si window.SB_CONF est défini ===== */
function sbFetch(path,opts={}){const c=window.SB_CONF;return fetch(c.url+'/rest/v1/'+path,{...opts,headers:{apikey:c.key,'Content-Type':'application/json',...(opts.headers||{})}}).then(async r=>{if(!r.ok)throw new Error((await r.text())||('Erreur '+r.status));const t=await r.text();return t?JSON.parse(t):null;});}
const REG_KEYS=['papiers','clients','params','modeles'];
function useSync({ofs,setOfs,reg,setReg}){
  const on=!!window.SB_CONF;const[st,setSt]=useState({etat:'ok',msg:''});
  const last=useRef(null),lastReg=useRef(null),timer=useRef(null),busy=useRef(false),seen=useRef(''),retry=useRef(false);
  if(on&&last.current===null){last.current={};(window.__BOOT.ofs||[]).forEach((o,i)=>last.current[o.id]=JSON.stringify([o,i]));lastReg.current={};REG_KEYS.forEach(k=>lastReg.current[k]=JSON.stringify(window.__BOOT[k]));seen.current=window.__BOOT.stamp||'';}
  const flush=async()=>{if(busy.current){timer.current=setTimeout(flush,400);return;}busy.current=true;setSt({etat:'busy',msg:''});
    try{const cur=window.__CUR;const up=[],ids=new Set();
      cur.ofs.forEach((o,i)=>{if(ids.has(o.id))return;ids.add(o.id);const j=JSON.stringify([o,i]);if(last.current[o.id]!==j)up.push({id:o.id,data:o,position:i});});
      const del=Object.keys(last.current).filter(id=>!ids.has(id));
      if(up.length)await sbFetch('lvsl_of',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up.map(r=>({...r,updated_at:new Date().toISOString()})))});
      if(del.length)await sbFetch('lvsl_of?id=in.('+del.map(encodeURIComponent).join(',')+')',{method:'DELETE'});
      const rup=REG_KEYS.filter(k=>lastReg.current[k]!==JSON.stringify(cur.reg[k])).map(k=>({cle:k,valeur:cur.reg[k],updated_at:new Date().toISOString()}));
      if(rup.length)await sbFetch('lvsl_reglages',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rup)});
      up.forEach(r=>last.current[r.id]=JSON.stringify([r.data,r.position]));del.forEach(id=>delete last.current[id]);rup.forEach(r=>lastReg.current[r.cle]=JSON.stringify(r.valeur));
      seen.current=new Date().toISOString();retry.current=false;setSt({etat:'ok',msg:''});}
    catch(e){retry.current=true;console.warn('Supabase écriture',e);setSt({etat:'err',msg:'modifications pas encore enregistrées, nouvel essai automatique…',detail:String(e.message||e).slice(0,300)});timer.current=setTimeout(flush,5000);}
    finally{busy.current=false;}};
  useEffect(()=>{if(!on)return;window.__CUR={ofs,reg};clearTimeout(timer.current);timer.current=setTimeout(flush,700);},[ofs,reg.papiers,reg.clients,reg.params,reg.modeles]);
  // lecture des modifications faites depuis un autre poste
  useEffect(()=>{if(!on)return;const poll=async()=>{if(busy.current)return;
      const dirty=window.__CUR&&(window.__CUR.ofs.some((o,i)=>last.current[o.id]!==JSON.stringify([o,i]))||Object.keys(last.current).length!==window.__CUR.ofs.length);if(dirty)return;
      try{const a=await sbFetch('lvsl_of?select=updated_at&order=updated_at.desc&limit=1'),b=await sbFetch('lvsl_reglages?select=updated_at&order=updated_at.desc&limit=1'),n=await sbFetch('lvsl_of?select=id');
        const stamp=[(a[0]||{}).updated_at,(b[0]||{}).updated_at].filter(Boolean).sort().pop()||'';
        if(stamp>seen.current||n.length!==Object.keys(last.current).length){const d=await loadAll();
          last.current={};d.ofs.forEach((o,i)=>last.current[o.id]=JSON.stringify([o,i]));REG_KEYS.forEach(k=>{if(d[k]!=null){lastReg.current[k]=JSON.stringify(d[k]);setReg[k](d[k]);}});
          window.__CUR={...window.__CUR,ofs:d.ofs};setOfs(d.ofs);seen.current=d.stamp;}
        if(!retry.current)setSt({etat:'ok',msg:''});}catch(e){console.warn('Supabase lecture',e);setSt({etat:'err',msg:'connexion à la base interrompue, nouvel essai dans 15 s',detail:String(e.message||e).slice(0,300)});}};
    const t=setInterval(poll,15000);window.addEventListener('focus',poll);return()=>{clearInterval(t);window.removeEventListener('focus',poll);};},[]);
  return {...st,retry:()=>{clearTimeout(timer.current);flush();window.dispatchEvent(new Event('focus'));}};
}
async function loadAll(){const rows=await sbFetch('lvsl_of?select=*&order=position');const regs=await sbFetch('lvsl_reglages?select=*');
  const d={ofs:rows.map(r=>r.data),stamp:[...rows.map(r=>r.updated_at),...regs.map(r=>r.updated_at)].filter(Boolean).sort().pop()||''};regs.forEach(r=>d[r.cle]=r.valeur);return d;}
function Sauvegardes({onRestore}){

  return <div><p className="note">Une sauvegarde complète (OF, historique, listes et réglages) est faite automatiquement chaque jour à la première ouverture du planning. Les 30 dernières sont listées ici.</p>

      {conf===b.id?<span className="row0"><button className="btn sm btn-danger" onClick={async()=>{try{const r=await sbFetch('lvsl_sauvegardes?id=eq.'+b.id+'&select=contenu');onRestore(r[0].contenu);}catch(e){setErr('La restauration a échoué.');}}}>Remplacer le planning actuel</button><button className="btn sm" onClick={()=>setConf(null)}>Annuler</button></span>:<button className="btn sm" onClick={()=>setConf(b.id)}>Restaurer</button>}</li>)}</ul>}</div>;
}
function Gate(){
  const[ok,setOk]=useState(()=>{try{return localStorage.getItem('lvsl-acces')===window.SB_CONF.hash;}catch(e){return false;}});
  const[pw,setPw]=useState('');const[err,setErr]=useState('');const[boot,setBoot]=useState(null);const[loadErr,setLoadErr]=useState('');
  const sha=async t=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const start=async()=>{setLoadErr('');try{let d=await loadAll();
      if(!d.ofs.length&&!d.papiers){const P={...DEFAULT_PARAMS};const ex=ensureBats(exemple(),P);
        await sbFetch('lvsl_of',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(ex.map((o,i)=>({id:o.id,data:o,position:i})))});
        const reg={papiers:PAPIERS_CSV,clients:[],params:P,modeles:[{id:'mbro',nom:'Brochure agrafée',ops:MAN_PRESETS.brochure},{id:'mfly',nom:'Flyers / affiches',ops:MAN_PRESETS.flyers}]};
        await sbFetch('lvsl_reglages',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(REG_KEYS.map(k=>({cle:k,valeur:reg[k]})))});d=await loadAll();}
      const jour=todayIso();try{const s=await sbFetch('lvsl_sauvegardes?jour=eq.'+jour+'&select=id');if(!s.length)await sbFetch('lvsl_sauvegardes',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({jour,contenu:{ofs:d.ofs,reglages:{papiers:d.papiers,clients:d.clients,params:d.params,modeles:d.modeles}}})});}catch(e){}
      window.__BOOT=d;setBoot(d);}catch(e){setLoadErr(String(e.message||e).slice(0,200));}};
  useEffect(()=>{if(ok)start();},[ok]);
  if(!ok)return <div className="gate"><form className="gbox" onSubmit={async e=>{e.preventDefault();const h=await sha(pw);if(h===window.SB_CONF.hash){try{localStorage.setItem('lvsl-acces',h);}catch(x){}setOk(true);}else setErr('Mot de passe incorrect.');}}>
    <span className="eyebrow">Le Vent Se Lève · atelier</span><h1>Planning impression</h1>
    <label className="lbl" htmlFor="g-pw">Mot de passe</label><input id="g-pw" className="inp" type="password" autoFocus value={pw} onChange={e=>{setPw(e.target.value);setErr('');}}/>
    {err&&<p className="warn">{err}</p>}<button className="btn btn-primary" type="submit">Entrer</button></form></div>;
  if(loadErr)return <div className="gate"><div className="gbox"><h1>Connexion impossible</h1><p className="warn">La base de données ne répond pas : {loadErr}</p><button className="btn btn-primary" onClick={start}>Réessayer</button></div></div>;
  if(!boot)return <div className="gate"><div className="gbox"><p>Chargement du planning…</p></div></div>;
  return <App/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(window.SB_CONF?<Gate/>:<App/>);
</script></body></html>
